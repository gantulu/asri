name: Duitku Sandbox E2E

on:
  push:
    paths:
      - ".github/workflows/duitku-sandbox-e2e.yml"

jobs:
  sandbox-e2e:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://oszqantvugvbvydlizix.supabase.co/functions/v1/duitku
      TEST_PHONE: "6281111111111"
      TEST_PASSWORD: "AsriE2E-20261009!"
      TEST_AMOUNT: "10000"
    steps:
      - name: Health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "$BASE_URL" | tee /tmp/health.json
          jq -e '.service == "asri-duitku" and .status == "ok" and .environment == "sandbox"' /tmp/health.json

      - name: Payment methods
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/payment-methods" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg phone "$TEST_PHONE" --arg password "$TEST_PASSWORD" --argjson amount "$TEST_AMOUNT" '{phone:$phone,password:$password,amount:$amount}')" \
            | tee /tmp/payment-methods.json
          jq -e '.responseCode == "00" and (.paymentFee | length > 0)' /tmp/payment-methods.json
          METHOD="$(jq -r '.paymentFee[0].paymentMethod' /tmp/payment-methods.json)"
          test -n "$METHOD"
          echo "Payment method responseCode=00; first method=$METHOD"

      - name: Create payment
        run: |
          set -euo pipefail
          METHOD="$(jq -r '.paymentFee[0].paymentMethod' /tmp/payment-methods.json)"
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/create" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc \
              --arg phone "$TEST_PHONE" \
              --arg password "$TEST_PASSWORD" \
              --arg method "$METHOD" \
              --arg email "e2e@asricollection.online" \
              --arg name "ASRI Sandbox" \
              --argjson amount "$TEST_AMOUNT" \
              '{phone:$phone,password:$password,paymentAmount:$amount,paymentMethod:$method,productDetails:"ASRI Sandbox E2E",email:$email,customerVaName:$name,itemDetails:[{name:"Sandbox Test",price:$amount,quantity:1}]}')" \
            | tee /tmp/create.json
          jq -e '.merchantOrderId != null and .amount == 10000 and .status == "pending" and .reference != null' /tmp/create.json

      - name: Transaction status
        run: |
          set -euo pipefail
          ORDER_ID="$(jq -r '.merchantOrderId' /tmp/create.json)"
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/status" \
            -H "Content-Type: application/json" \
            --data "$(jq -nc --arg phone "$TEST_PHONE" --arg password "$TEST_PASSWORD" --arg order "$ORDER_ID" '{phone:$phone,password:$password,merchantOrderId:$order}')" \
            | tee /tmp/status.json
          jq -e '.merchantOrderId == $order and (.statusCode == "01" or .statusCode == "00" or .statusCode == "02")' --arg order "$ORDER_ID" /tmp/status.json
          echo "Sandbox E2E payment flow completed for $ORDER_ID"
