name: Frontend Build

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm install
      - run: npm run build
      - name: Commit generated lockfile
        working-directory: .
        run: |
          if [ ! -f frontend/package-lock.json ]; then
            echo "package-lock.json was not generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet -- frontend/package-lock.json; then
            exit 0
          fi
          git commit -m "chore(frontend): add npm lockfile"
          git push origin HEAD:feat/mobile-only-frontend-v2
